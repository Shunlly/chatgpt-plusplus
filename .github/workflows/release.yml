name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 说明：macOS DMG 需要在装有官方 ChatGPT.app 的机器上生成补丁副本后才能打包，
# CI 上无法构建，由发布者本地执行 npm run package:dmg 后上传到 Release。
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - shell: pwsh
        run: |
          choco install innosetup -y
          # choco 装的 Inno Setup 不会自动进当前 job 的 PATH，显式追加
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm run package:exe
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/installers/*.exe
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-Item dist/installers/*.exe | Select-Object -First 1
          if (-not $exe) { throw "Windows EXE 未生成" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "See CHANGELOG.md" --verify-tag
          }
          gh release upload $tag $exe.FullName --clobber
