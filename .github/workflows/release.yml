name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/installers/*.dmg

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - shell: pwsh
        run: |
          choco install nsis -y
          # choco 装的 NSIS 不会自动进当前 job 的 PATH，显式追加
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm run package:exe
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/installers/*.exe
