<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChatGPT++</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #10131a; color: #e8ecf3; font-size: 14px;
    -webkit-user-select: none; user-select: none;
  }
  header { padding: 18px 20px 12px; border-bottom: 1px solid #232a36; display: flex; align-items: center; gap: 10px; }
  header .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #2de1c2, #7b6cff); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0b0e14; }
  header h1 { font-size: 16px; font-weight: 700; }
  header .ver { color: #8b95a7; font-size: 12px; margin-top: 2px; }
  .badge { margin-left: auto; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: #123f2c; color: #3ee08a; }
  .badge.warn { background: #4a3410; color: #f0b34a; }
  main { padding: 16px 20px 24px; overflow-y: auto; height: calc(100vh - 66px); }
  section { margin-bottom: 22px; }
  h2 { font-size: 13px; color: #8b95a7; font-weight: 600; margin-bottom: 10px; letter-spacing: .05em; }
  .status-card { background: #171c26; border: 1px solid #232a36; border-radius: 12px; padding: 14px; }
  .status-row { display: flex; justify-content: space-between; padding: 5px 0; color: #aeb6c4; }
  .status-row b { color: #e8ecf3; font-weight: 600; text-align: right; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  button {
    border: 0; border-radius: 9px; padding: 9px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    background: #242c3b; color: #e8ecf3; transition: filter .15s;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: linear-gradient(135deg, #2de1c2, #4aa8ff); color: #0b0e14; }

  /* 拖拽上传区（3.3） */
  .drop-zone {
    border: 1.5px dashed #3a4456; border-radius: 12px; padding: 14px 12px;
    text-align: center; color: #8b95a7; cursor: pointer; margin-bottom: 12px;
    background: #141926; transition: border-color .15s, background .15s, transform .1s;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: #2de1c2; background: #16292b; }
  .drop-zone.dragover { transform: scale(1.01); }
  .drop-zone .dz-icon { font-size: 20px; margin-bottom: 4px; }
  .drop-zone .dz-hint { font-size: 11px; color: #5d6676; margin-top: 3px; }

  /* 响应式网格（3.4）：auto-fill 自适应列数，上限防过宽 */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    max-width: 1200px;
    transition: opacity .3s ease, transform .3s ease;
  }
  .theme-grid.switching { opacity: 0; transform: translateY(3px); transition: opacity .15s ease, transform .15s ease; }
  .theme-card {
    position: relative; border-radius: 11px; overflow: hidden;
    background: #171c26; border: 2px solid #232a36; cursor: pointer;
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .theme-card:hover { transform: translateY(-1px); }
  /* 当前主题高亮（3.2）：边框 + 阴影 + 角标 */
  .theme-card.active { border-color: #2de1c2; box-shadow: 0 0 0 1px #2de1c2, 0 4px 14px rgba(45, 225, 194, .18); }
  .theme-card .active-badge {
    position: absolute; top: 5px; right: 5px; z-index: 3;
    background: linear-gradient(135deg, #2de1c2, #4aa8ff); color: #0b0e14;
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    opacity: 0; transform: scale(.8); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .theme-card.active .active-badge { opacity: 1; transform: scale(1); }
  .theme-card .thumb {
    position: relative; height: 58px; background-color: #202838; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .theme-card .thumb-bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    opacity: 0; transition: opacity .3s ease;
  }
  .theme-card.loaded .thumb-bg { opacity: 1; }
  .theme-card .thumb-fallback { font-size: 20px; font-weight: 800; color: #0b0e14; }
  .theme-card.loaded .thumb-fallback { display: none; }
  /* 加载骨架（3.1）：旋转 spinner 覆盖在卡片上 */
  .theme-card .thumb-spinner {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(16, 19, 26, .55);
  }
  .theme-card.loading .thumb-spinner { display: flex; }
  .theme-card .thumb-spinner::after {
    content: ""; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.25); border-top-color: #2de1c2;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 加载失败（3.1） */
  .theme-card .thumb-error { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 11px; color: #ff8fa3; background: rgba(16, 19, 26, .55); }
  .theme-card.error .thumb-error { display: flex; }
  .theme-card .name {
    padding: 7px 8px; font-size: 12px; text-align: center; color: #cfd6e2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .theme-card.error .name { color: #9a6b74; }

  /* 空状态（3.5） */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 26px 12px; color: #8b95a7; border: 1px dashed #2c3442; border-radius: 12px;
  }
  .empty-state .es-icon { font-size: 2.4rem; }
  .empty-state .es-title { font-weight: 600; color: #cfd6e2; }
  .empty-state .es-hint { font-size: 12px; }

  /* 预览模态框（3.3） */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50; background: rgba(5, 7, 11, .72);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    width: 100%; max-width: 360px; background: #171c26; border: 1px solid #2a3344;
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    animation: modal-in .18s ease;
  }
  @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .modal h3 { font-size: 15px; }
  .modal .modal-preview {
    border-radius: 10px; overflow: hidden; background: #0b0e14; height: 150px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal .modal-preview img { max-width: 100%; max-height: 150px; object-fit: contain; }
  .modal input[type="text"] {
    background: #0f141d; border: 1px solid #2a3344; border-radius: 9px;
    color: #e8ecf3; padding: 9px 11px; font-size: 13px; outline: none; width: 100%;
  }
  .modal input[type="text"]:focus { border-color: #2de1c2; }
  .modal .modal-error { color: #ff8fa3; font-size: 12px; min-height: 16px; }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .log-box { background: #0b0e14; border: 1px solid #232a36; border-radius: 10px; padding: 10px 12px; font: 11px/1.6 ui-monospace, Menlo, monospace; color: #9fe8c4; max-height: 200px; overflow-y: auto; white-space: pre-wrap; display: none; }
  .hint { color: #6b7484; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="logo">++</div>
  <div>
    <h1>ChatGPT++</h1>
    <div class="ver" id="ver">加载中…</div>
  </div>
  <span class="badge warn" id="badge">检查中</span>
</header>
<main>
  <section>
    <h2>补丁状态</h2>
    <div class="status-card">
      <div class="status-row"><span>安装状态</span><b id="inst">—</b></div>
      <div class="status-row"><span>已补丁应用</span><b id="apps">—</b></div>
      <div class="status-row"><span>安装目录</span><b id="appRoot">—</b></div>
      <div class="actions">
        <button id="openBtn" class="primary">打开 ChatGPT</button>
        <button id="installBtn">安装 / 修复</button>
        <button id="repairBtn" disabled>仅修复</button>
        <button id="uninstallBtn" class="danger" disabled>卸载</button>
      </div>
      <div class="hint">已安装后，双击 ChatGPT++ 会直接打开增强版 ChatGPT 主界面（带主题等特征）；本面板仅在未安装时出现，用于安装引导。</div>
    </div>
  </section>
  <section>
    <h2>主题（切换后 2 秒内生效）</h2>
    <div class="drop-zone" id="dropZone">
      <div class="dz-icon">⬆️</div>
      <div>拖拽图片到此处，或点击选择图片</div>
      <div class="dz-hint">创建自定义主题（PNG/JPEG/WebP/GIF，≤6MB）</div>
    </div>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
    <div class="theme-grid" id="themes">加载中…</div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="es-icon">🎨</div>
      <div class="es-title">暂无自定义主题</div>
      <div class="es-hint">上传图片创建第一个主题</div>
    </div>
  </section>
  <section>
    <h2>日志</h2>
    <div class="log-box" id="log"></div>
  </section>
</main>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal">
    <h3>创建自定义主题</h3>
    <div class="modal-preview"><img id="previewImg" alt="主题预览" /></div>
    <input type="text" id="themeName" placeholder="主题名称" maxlength="60" />
    <div class="modal-error" id="modalError"></div>
    <div class="modal-actions">
      <button id="modalCancel">取消</button>
      <button id="modalConfirm" class="primary">创建主题</button>
    </div>
  </div>
</div>

<script src="./renderer.js"></script>
</body>
</html>
